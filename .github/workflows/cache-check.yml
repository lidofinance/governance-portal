name: Cache Check

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check-cache:
    runs-on: ubuntu-latest
    name: Check events cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Check events cache
        run: yarn check-all-cache
        env:
          CACHE_CHECK_MAINNET_ONLY: ${{ github.base_ref == 'main' }}
