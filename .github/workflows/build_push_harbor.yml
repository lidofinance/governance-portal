name: CI K8s Dev & Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feat/k8s

permissions:
  contents: read

env:
  APP: governance-portal
  REGISTRY_DEV: registry.dev.k8s-dev.org
  REGISTRY_STAGING: registry.staging.k8s-staging.org
  REPOSITORY: team-daotech
  REGISTRY_USER: robot$team-daotech-rw
  IMAGE_TAG_DEV: dev
  IMAGE_TAG_STAGING: staging

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    name: Build and push dev & staging images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Login to dev Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DEV }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Login to staging Harbor
        id: login-staging
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_STAGING }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_DEV }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG_DEV }}
          builder: ${{ steps.buildx.outputs.name }}

      - name: Push staging image
        if: steps.login-staging.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_STAGING }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG_STAGING }}
          builder: ${{ steps.buildx.outputs.name }}
