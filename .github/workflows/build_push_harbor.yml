name: CI K8s Dev & Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feat/k8s

permissions:
  contents: read

env:
  APP: governance-portal
  REGISTRY_DEV: registry.dev.k8s-dev.org
  REGISTRY_STAGING: registry.staging.k8s-staging.org
  REPOSITORY: team-daotech
  REGISTRY_USER: robot$team-daotech-rw
  IMAGE_TAG_DEV: dev
  IMAGE_TAG_STAGING: staging

jobs:
  build-dev:
    runs-on: ubuntu-22.04
    name: Build and push dev image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Login to dev Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DEV }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_DEV }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG_DEV }}
          builder: ${{ steps.buildx.outputs.name }}

  # Separate job: the environment is branch-restricted by terraform, and a job denied by that
  # policy fails before its steps run — keeping it apart means dev never depends on staging.
  push-staging:
    runs-on: ubuntu-22.04
    name: Copy dev image to staging Harbor
    needs: build-dev
    environment: harbor_stage_release
    steps:
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Login to dev Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DEV }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Login to staging Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_STAGING }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_STAGE_TOKEN }}

      - name: Copy image
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_STAGING }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG_STAGING }} \
            ${{ env.REGISTRY_DEV }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG_DEV }}
