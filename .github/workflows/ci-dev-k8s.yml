name: CI K8s Dev

run-name: Build and push governance-portal:dev to dev

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: dev
      harbor_project: team-daotech
      image: governance-portal
    secrets: inherit
