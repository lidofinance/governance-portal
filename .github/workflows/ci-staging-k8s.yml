name: CI K8s Staging

run-name: Build and push governance-portal:staging to staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: staging
      harbor_project: team-daotech
      image: governance-portal
    secrets: inherit
